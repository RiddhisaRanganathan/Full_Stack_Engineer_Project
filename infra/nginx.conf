worker_processes auto;
worker_rlimit_nofile 65536;
events { worker_connections 8192; multi_accept on; }
http {
  include /etc/nginx/mime.types;
  proxy_cache_path /var/cache/nginx/product levels=1:2 keys_zone=product:1m max_size=10m inactive=1m;
  limit_req_zone $binary_remote_addr zone=checkout:10m rate=5r/s;
  limit_conn_zone $binary_remote_addr zone=perip:10m;
  resolver 127.0.0.11 valid=5s ipv6=off;
  upstream api {
    zone api 64k;
    least_conn;
    server api:3000 resolve max_fails=2 fail_timeout=5s;
    keepalive 64;
  }
  server {
    listen 8080;
    client_max_body_size 2k;
    client_header_timeout 5s;
    client_body_timeout 5s;
    keepalive_timeout 10s;
    limit_conn perip 100;
    limit_req_status 429;
    error_page 429 = @limited;
    location @limited { default_type application/json; add_header Retry-After 10 always; return 429 '{"error":"Gateway rate limited; request not accepted"}'; }
    location / {
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Connection '';
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header Host $host;
      proxy_connect_timeout 2s;
      proxy_read_timeout 8s;
      proxy_send_timeout 5s;
      proxy_next_upstream off;
    }
    location = /api/product {
      proxy_pass http://api;
      proxy_cache product;
      proxy_cache_valid 200 1s;
      proxy_cache_lock on;
      proxy_cache_use_stale updating error timeout;
      add_header X-Cache $upstream_cache_status;
    }
    location = /api/checkout {
      limit_req zone=checkout burst=20 nodelay;
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Connection '';
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_connect_timeout 2s;
      proxy_read_timeout 8s;
      proxy_next_upstream off;
    }
  }
}
